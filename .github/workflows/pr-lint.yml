name: PR lint

# Org convention for every change that lands on main (TogetherWeOwn GitHub standard):
#   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
#     Types: feat fix perf refactor test docs build ci chore revert style security.
#     Public text carries no tracker ids (see the strict check below): keep card IDs out of the title and body.
#   * PR body explains what changed, why, and how it was tested.
#   * Repos are squash-merge only and the squash commit title is the PR title, so the history on
#     main is one conventional commit per PR. The push job below flags any commit that bypasses it
#     (for example a merge call that passes its own commit_title).
# Forward control for public repos: the strict subset (tracker ids scoped to TOG below,
# instance UI links like /TOG/issues/, and the internal host) always fails the PR
# title/body check and any commit message pushed to main. STRICT_INTERNAL_LEVEL
# fail-closed: any value other than an explicit "warning" (or "warn") downgrade fails.
# Advisory remainder keeps its current level.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  STRICT_INTERNAL_LEVEL: "error" # fail-closed strict public-text gate; "warning" downgrades it

jobs:
  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check title, body and commits
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        shell: python3 {0}
        run: |
          import json, os, re, sys

          TYPES = "feat|fix|perf|refactor|test|docs|build|ci|chore|revert|style|security"
          HEADER = re.compile(rf"^({TYPES})(\([A-Za-z0-9._/,-]+\))?!?: \S.*$")
          HELP = ("Expected a Conventional Commits header, e.g. 'fix(auth): refuse expired sudo "
                  "sessions' or 'feat(events): shareable event page'. Allowed types: "
                  + TYPES.replace("|", ", ") + ". Keep tracker ids, instance links and internal hosts out of the title and body.")
          # Strict public-text subset: tracker ids (this file's prefix-scoped pattern),
          # instance UI links and the internal host. These always fail a public title/body
          # check unless the strict level is explicitly downgraded to a warning (fail-closed).
          TRACKER_ID = re.compile(r"\bTOG-\d+\b")
          UI_LINK = re.compile(r"/TOG/(issues|agents|projects|approvals|runs)/")
          HOST_INTERNAL = re.compile(r"\binfextion\.net\b", re.IGNORECASE)
          STRICT_FIXED = [(UI_LINK, "an instance UI link"), (HOST_INTERNAL, "the internal host")]

          def header_errors(text):
              errs = []
              if not HEADER.match(text):
                  errs.append("not a Conventional Commits header")
              if len(text) > 100:
                  errs.append(f"{len(text)} chars (max 100)")
              if text.rstrip().endswith("."):
                  errs.append("ends with a period")
              return errs

          def strict_internal_hits(text):
              """Fail-closed strict subset for public title/body. Labels only, never values."""
              hits = []
              if TRACKER_ID.search(text or ""):
                  hits.append("a tracker id")
              for pat, label in STRICT_FIXED:
                  if pat.search(text or ""):
                      hits.append(label)
              return hits

          def report_strict(hits, where):
              raw = (os.environ.get("STRICT_INTERNAL_LEVEL") or "").strip().lower()
              level = "warning" if raw in ("warning", "warn") else "error"
              print(f"::{level} title=Strict internal ref in {where}::{where.capitalize()} holds " +
                    f"{', '.join(hits)}. Public text carries no tracker ids, instance " +
                    "links or internal hosts: say it in plain words and link only public " +
                    "GitHub issues.")
              return level == "error"

          failed = False
          if os.environ["EVENT"] == "pull_request":
              title = os.environ.get("TITLE", "").strip()
              body = os.environ.get("BODY", "") or ""
              author = os.environ.get("AUTHOR", "")
              if author.endswith("[bot]") and author.startswith(("dependabot", "renovate")):
                  if header_errors(title):
                      print(f"::warning::{author} title '{title}' is not conventional; set "
                            "commit-message.prefix (e.g. chore(deps)) in the bot config.")
                  sys.exit(0)
              errs = header_errors(title)
              if errs:
                  failed = True
                  print(f"::error title=PR title::'{title}': {'; '.join(errs)}. {HELP}")
              text = re.sub(r"<!--.*?-->", "", body, flags=re.S)
              if len(re.sub(r"\s", "", text)) < 40:
                  failed = True
                  print("::error title=PR body::The description is empty. Say what changed, why, "
                        "and how it was tested (see the PR template).")
              for where, text_in in (("the title", title), ("the body", body)):
                  hits = strict_internal_hits(text_in)
                  if hits:
                      if report_strict(hits, where):
                          failed = True
          else:
              for c in json.loads(os.environ.get("COMMITS") or "[]") or []:
                  message = c.get("message") or ""
                  subject = message.splitlines()[0] if message else ""
                  hits = strict_internal_hits(message)
                  if hits:
                      if report_strict(hits, f"commit {c.get('id','')[:10]} on main"):
                          failed = True
                  if subject.startswith(("Merge ", "Revert \"")):
                      continue
                  errs = header_errors(subject)
                  if errs:
                      failed = True
                      print(f"::error title=Commit on main::{c.get('id','')[:10]} '{subject}': "
                            f"{'; '.join(errs)}. Merge PRs with squash and the PR title as the "
                            "commit title.")
          if failed:
              sys.exit(1)
          print("PR conventions OK")
