name: Host compatibility

# Pull requests, pushes to main and the nightly run reach this workflow through
# the `host-compat` job in ci.yml, so `ci-ok` covers them. Manual dispatch stays
# available for an on-demand run against the live host images.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Not `github.workflow`: in a called workflow that is the caller's name, so the
# group would collide with the caller's own and cancel the run. The event name
# (the caller's, when called) keeps a manual dispatch on the same ref from
# cancelling the host-compat job of a running CI run.
concurrency:
  group: host-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Deployed, latest, and baseline host images
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve immutable image matrix
        run: .github/scripts/resolve-host-images.sh > "$RUNNER_TEMP/host-images.json"
      - name: Build plugin
        run: make build VERSION=0.7.1 OUT=dist/subscription-pool-v0.7.1.so
      - name: Run compatibility matrix
        env:
          HOST_MATRIX_NAMESPACE: root
          SP_CLOUDFLARE_PAGE_OUT: ${{ runner.temp }}/cloudflare-page
        run: sudo --preserve-env=HOST_MATRIX_NAMESPACE,SP_CLOUDFLARE_PAGE_OUT make test-host-matrix VERSION=0.7.1 OUT=dist/subscription-pool-v0.7.1.so HOST_IMAGES="$RUNNER_TEMP/host-images.json" HOST_MATRIX_WORK="$RUNNER_TEMP/host-matrix"
      # The matrix exports the quota page a real host served; render it in a
      # browser at desktop and mobile sizes. A missing export fails the step.
      - name: Check Cloudflare quota page in a browser
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/cloudflare-page"
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          npx --no-install playwright install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/check-cloudflare-page.cjs" "$RUNNER_TEMP/cloudflare-page"
