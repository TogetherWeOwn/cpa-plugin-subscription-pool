# Use the same secret through CLIProxyAPI's supported secret/config mechanism.
# Never commit a populated copy of this file.
auth-dir: /app/auths

claude-api-key:
  - api-key: ${ZAI_CODING_PLAN_KEY}
    base-url: https://api.z.ai/api/anthropic
    prefix: zai

openai-compatibility:
  - name: zai-coding-plan
    base-url: https://api.z.ai/api/coding/paas/v4
    api-key-entries:
      - api-key: ${ZAI_CODING_PLAN_KEY}
  # synthetic.new: the infinite-mode provider (Big plan, free, slow, streaming
  # only) sits at a lower priority and also serves the paid DeepSeek alias, so
  # the synthetic module can fall back to it when the weekly credits run low.
  - name: synthetic-infinite
    priority: -1
    base-url: https://api.synthetic.new/openai/v1
    api-key-entries:
      - api-key: ${SYNTHETIC_API_KEY}
    models:
      - name: "infinite:small:vision"
        alias: synthetic-infinite/deepseek-v4.1-flash
      - name: "infinite:small:vision"
        alias: synthetic/deepseek-v4.1-flash
  - name: synthetic
    base-url: https://api.synthetic.new/openai/v1
    api-key-entries:
      - api-key: ${SYNTHETIC_API_KEY}
    models:
      - name: "hf:deepseek-ai/DeepSeek-V4.1-Flash"
        alias: synthetic/deepseek-v4.1-flash
      - name: "hf:moonshotai/Kimi-K3"
        alias: synthetic/kimi-k3

plugins:
  enabled: true
  dir: plugins
  configs:
    subscription-pool:
      enabled: true
      priority: 1000
      cpa-config-path: /app/config.yaml
      providers:
        zai:
          quota-refresh-interval: 2m
          authoritative-max-age: 5m
          threshold-percent: 97
          suspend-duration: 30m
          fallback-cooldown: 10m
          state-retention: 192h
          default-plan: pro
          accounts:
            # The suffix is only a redacted display/override selector. Credential
            # pairing always compares the complete key in memory.
            - key-suffix: replace-with-unique-suffix
              name: zai-pro-1
              plan: pro
              disabled: false
        opencode-go:
          threshold-percent: 97
          # Optional module-level default: a dashboard Bearer key for GET
          # /zen/go/v1/usage. Each account's own /usage response only ever
          # reports that account's own usage, so this default is only correct
          # when every account below shares one dashboard key -- most
          # deployments should instead set accounts[].dashboard-api-key per
          # account. Omitting both is valid -- the module fails closed to
          # "unknown" reset times rather than guessing.
          dashboard-api-key: ${OPENCODE_GO_DASHBOARD_KEY}
          accounts:
            - name: go-a
              auth-ids: ["replace-with-managed-auth-id"]
              # Overrides the module-level dashboard-api-key above for this
              # account. Required whenever accounts do not share one key.
              dashboard-api-key: ${OPENCODE_GO_A_DASHBOARD_KEY}
        synthetic:
          # Stop new paid requests at this share of the weekly credits; aliases
          # the infinite provider also serves move to infinite mode instead.
          threshold-percent: 95
          # GET /v2/quotas does not count against the plan. "0" disables
          # polling and relies on the x-synthetic-quotas response header.
          quota-refresh-interval: 2m
          # Synthetic publishes no concurrency limit. Set these from your own
          # measurements; 0 means no local cap.
          max-concurrent: 0
          infinite-max-concurrent: 0
          # Defaults shown; rename only if your providers use other names.
          paid-providers: [synthetic]
          infinite-providers: [synthetic-infinite]
